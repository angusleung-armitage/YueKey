name: Build, test and release YueKey

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  typing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified cross-platform typing data
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          /usr/bin/python3 tools/fetch_sources.py
          /usr/bin/python3 tools/build_data.py
          /usr/bin/python3 tools/prepare_windows_data.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-data
          path: build/windows-data/
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Ubuntu environment
        run: docker build --network host -f Dockerfile.dev -t quick-hk-dev:26.04 .
      - name: Build, test and package
        run: >-
          docker run --rm --init --user "$(id -u):$(id -g)" -v "$PWD:/work"
          quick-hk-dev:26.04 make all test packages
      - name: Check GNOME extension lifecycle
        run: |
          node desktop/gnome/test-extension.cjs
          node desktop/gnome/test-dictation.cjs
      - name: Check dictation gesture and Rime bridge
        run: |
          docker run --rm --init --user "$(id -u):$(id -g)" -v "$PWD:/work" quick-hk-dev:26.04 ctest --test-dir build/native --output-on-failure
          docker run --rm --init -e QUICK_HK_ISOLATED_BUS=1 -v "$PWD:/work:ro" quick-hk-dev:26.04 dbus-run-session -- python3 tools/smoke_dictation_bridge.py
      - name: Validate Debian metadata
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro"
          quick-hk-dev:26.04 lintian --tag-display-limit 0 dist/*.deb
      - name: Install and exercise both frontends
        run: >-
          docker run --rm --init --network host -v "$PWD:/work:ro"
          quick-hk-dev:26.04 python3 tools/test_packages.py --with-desktops
      - name: Package corresponding source
        run: python3 tools/package_source.py
      - name: Keep development packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ubuntu
          path: |
            dist/*.deb
            dist/*-source.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: typing-data
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python64
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/windows/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-data
          path: build/windows-data
      - name: Install hash-locked build and CPU runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r desktop/windows/requirements.txt
      - name: Test Windows deployment, gesture and focus guards
        run: python -m pytest tests/test_windows.py -q
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python32
        with:
          python-version: '3.12'
          architecture: x86
      - name: Test typing in the official Weasel runtime
        run: |
          & "${{ steps.python32.outputs.python-path }}" tools/smoke_weasel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.python64.outputs.python-path }}" tools/smoke_weasel.py
      - name: Package setup EXE and portable application
        run: '& "${{ steps.python64.outputs.python-path }}" tools/package_windows.py'
      - name: Test installer, repair, CPU runtime and uninstall without a microphone
        run: '& "${{ steps.python64.outputs.python-path }}" tools/test_windows_installer.py'
      - name: Keep installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-diagnostics
          path: build/windows-installer/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            dist/YueKey-*-windows-x64.zip
            dist/YueKey-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate and verify final checksums
        run: |
          python3 tools/release_checksums.py
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish free downloads after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite an already published release"'
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "粵鍵 YueKey $RELEASE_TAG" --notes-file docs/RELEASE.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
