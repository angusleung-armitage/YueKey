# 粵鍵 YueKey — Cantonese Quick input defaults.
schema:
  schema_id: quick_hk
  name: 港式速成
  version: '0.6.7'
  description: 香港用字、速成首尾碼、個人詞頻及關聯字

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
  - name: prediction
    reset: 1
    states: [關聯字關, 關聯字開]
  - name: ascii_punct
    reset: 0
    states: [。，, '.,']

engine:
  processors:
    - ascii_composer
    - lua_processor@*quick_hk*processor
    - quick_hk_predictor
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - quick_hk_predict_translator
  filters:
    - uniquifier
    - lua_filter@*quick_hk*visibility

menu:
  page_size: 9
  alternative_select_keys: '123456789'

quick_hk:
  show_candidates: true
  learning: true
  switch_key: Shift_L

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  max_code_length: 2
  auto_select: false

translator:
  dictionary: quick_hk
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_encoder: false
  enable_user_dict: true
  preedit_format:
    - xlit/abcdefghijklmnopqrstuvwxyz/日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符/
  comment_format:
    - xform/.+//

predictor:
  db: quick_hk.predict.db
  max_candidates: 90
  max_iterations: 1

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: noop
    Shift_L: commit_code
    Shift_R: noop
    Control_L: noop
    Control_R: noop

key_binder:
  bindings:
    - {when: has_menu, accept: Left, send: Up}
    - {when: has_menu, accept: Right, send: Down}
    - {when: has_menu, accept: bracketleft, send: Page_Up}
    - {when: has_menu, accept: bracketright, send: Page_Down}
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}

punctuator:
  full_shape: &punctuation
    ',': {commit: '，'}
    '.': {commit: '。'}
    '?': {commit: '？'}
    '!': {commit: '！'}
    ':': {commit: '：'}
    ';': {commit: '；'}
    '(': '（'
    ')': '）'
    '[': '「'
    ']': '」'
    '{': '『'
    '}': '』'
    '<': '《'
    '>': '》'
    '"': {pair: ['「', '」']}
    "'": {pair: ['『', '』']}
    '/': '／'
    '\': '、'
    '-': '－'
    '=': '＝'
    '@': '＠'
    '#': '＃'
    '$': '＄'
    '%': '％'
    '&': '＆'
    '*': '＊'
    '_': '＿'
    '+': '＋'
  half_shape: *punctuation

__patch:
  - quick_hk.custom:/patch?
